<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabHelp</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><b class="navbar-brand">LabHelp</b><span id="userBadge" class="text-white"></span></div></nav><main class="container py-4"><div id="loginCard" class="card p-4 mx-auto" style="max-width:500px"><h2>Computer Lab Helpdesk</h2><p class="text-muted">Report and track technical problems.</p><form id="loginForm"><input id="email" class="form-control mb-2" value="student@lab.local"><input id="password" type="password" class="form-control mb-3" value="student123"><button class="btn btn-primary w-100">Login</button></form><div id="loginMsg"></div></div><section id="appArea" class="d-none"><div class="d-flex justify-content-between mb-3"><h2>My Tickets</h2><button class="btn btn-outline-danger" onclick="logout()">Logout</button></div><div class="card p-3 mb-4"><h5>Raise Ticket</h5><form id="ticketForm"><select id="category" class="form-select mb-2"><option>Hardware</option><option>Network</option><option>Software</option><option>Lab Equipment</option><option>Access</option><option>Electrical</option></select><input id="deviceId" type="number" class="form-control mb-2" placeholder="Device ID (optional)"><textarea id="description" class="form-control mb-2" placeholder="Describe the issue" required></textarea><button class="btn btn-success">Submit</button></form><div id="ticketMsg"></div></div><div id="tickets"></div></section></main><script src="/static/js/app.js"></script></body></html>
